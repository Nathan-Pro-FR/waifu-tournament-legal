<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informations Légales — Waifu Tournament</title>
    <style>
        :root {
            --bg: #0f111a;
            --card: #1a1d2d;
            --border: #2e334d;
            --accent: #ff477e;
            --text: #f0f2f8;
            --muted: #9aa1c2;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .card {
            max-width: 520px;
            width: 100%;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 36px;
            text-align: center;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
        }
        h1 { font-size: 1.7rem; margin-bottom: 10px; }
        h1 span { color: var(--accent); }
        p { color: var(--muted); margin-bottom: 28px; font-size: 0.95rem; }
        .links { display: flex; flex-direction: column; gap: 14px; }
        a {
            display: block;
            padding: 14px 20px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 700;
            transition: transform 0.15s, opacity 0.2s;
        }
        a:hover { transform: translateY(-2px); opacity: 0.9; }
        .btn-primary { background: var(--accent); color: #ffffff; }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text);
            border: 1px solid var(--border);
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>⚔️ <span>Waifu</span> Tournament</h1>
        <p>Documentation légale officielle du bot Discord privé.</p>
        <div class="links">
            <a href="tos.html" class="btn-primary">📜 Conditions Générales d'Utilisation (ToS)</a>
            <a href="privacy.html" class="btn-secondary">🔒 Politique de Confidentialité (Privacy Policy)</a>
        </div>
    </div>
</body>
</html>
